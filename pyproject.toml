[project]
name = "cired-hal-harvest"
version = "1.0.0"
description = "Harvest the open-access CIRED publications deposited in HAL"
requires-python = ">=3.11"
license = "CECILL-2.1"
dependencies = ["requests>=2.31"]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.14.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["adherence: ruff and hygiene checks", "integration: spawns a subprocess"]
